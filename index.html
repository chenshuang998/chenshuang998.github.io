<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🍃 抽屉相册 · 黑胶留声</title>
    <style>
        /* ===== 全局风格 (保持不变) ===== */
        body { 
            font-family: '微软雅黑', 'Segoe UI', sans-serif;
            background: #fff4e6; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        * { box-sizing: border-box; }

        .envelope {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #fbe9d2;
            background-image: radial-gradient(circle at 30% 40%, #fff3e0 0%, #fbe9d2 90%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: inset 0 0 30px rgba(180, 100, 30, 0.05);
            border-bottom: 4px solid #e6c7a2;
        }
        .envelope.hide {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-100%);
        }
        .envelope .letter {
            font-size: 24px;
            color: #5d3f2b;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.8;
            padding: 0 24px;
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 rgba(255, 245, 220, 0.8);
        }
        .envelope .icon {
            font-size: 76px;
            color: #c25b3a;
            filter: drop-shadow(0 8px 12px rgba(160, 80, 40, 0.2));
            animation: beat 1.8s infinite;
        }
        @keyframes beat {
            0%,100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.12); opacity: 1; }
        }

        .gallery {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.6s ease, transform 0.5s ease;
        }
        .gallery.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            text-align: center;
            color: #4e3620;
            font-weight: 400;
            letter-spacing: 4px;
            margin: 15px 0 5px;
            font-size: 2.2rem;
            text-shadow: 2px 2px 0 #f0dbc0;
        }

        .record-player {
            text-align: center;
            margin: 15px 0 25px;
            position: relative;
        }

        .vinyl-record {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            background: radial-gradient(circle at 30% 28%, #3a3a3a, #0f0f0f 75%, #020202);
            border-radius: 50%;
            box-shadow: 
                0 12px 28px rgba(0, 0, 0, 0.5),
                0 0 0 2px #2b1a0e,
                inset 0 -5px 15px rgba(0,0,0,0.8),
                inset 0 5px 12px rgba(255,255,240,0.08);
            cursor: pointer;
            position: relative;
            transition: box-shadow 0.25s, transform 0.1s;
            border: 1px solid #4a3724;
        }
        .vinyl-record:hover {
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6), 0 0 0 3px #b87c4b, inset 0 -2px 8px rgba(0,0,0,0.7);
            transform: scale(1.01);
        }
        .vinyl-record:active {
            transform: scale(0.99);
        }

        .vinyl-record::before {
            content: "";
            position: absolute;
            top: 6%;
            left: 6%;
            width: 88%;
            height: 88%;
            border-radius: 50%;
            background: repeating-radial-gradient(circle at 40% 40%, 
                rgba(70,70,70,0.5) 0px, 
                rgba(30,30,30,0.7) 3px, 
                #1a1a1a 6px, 
                #0a0a0a 9px);
            opacity: 0.7;
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .vinyl-record::after {
            content: "";
            position: absolute;
            top: 10%;
            left: 15%;
            width: 35%;
            height: 20%;
            background: radial-gradient(circle, rgba(255,255,250,0.2) 0%, rgba(255,255,240,0) 80%);
            border-radius: 50%;
            transform: rotate(-15deg);
            pointer-events: none;
            filter: blur(3px);
        }

        .record-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36%;
            height: 36%;
            background: #c94f2b;
            background: linear-gradient(145deg, #d95c3a, #a83c1c);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f9e7d2;
            font-weight: bold;
            box-shadow: 
                inset 0 -3px 6px #3b1a0e,
                inset 0 3px 8px #ffb08c,
                0 2px 8px rgba(0,0,0,0.4);
            border: 2px solid #d6a177;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
        }
        .record-label .label-title {
            font-size: 13px;
            margin-bottom: 2px;
            text-shadow: 1px 1px 0 #3e1a0c;
        }
        .record-label .label-sub {
            font-size: 9px;
            opacity: 0.9;
            border-top: 1px dashed #fad5b5;
            padding-top: 4px;
        }
        .center-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: #1f140e;
            border-radius: 50%;
            box-shadow: inset 0 2px 3px #000, 0 1px 2px #694d38;
            border: 1px solid #7a5a41;
            z-index: 5;
            pointer-events: none;
        }

        .vinyl-record.spin {
            animation: spin 3.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .record-player p {
            margin-top: 14px;
            color: #5b3f2b;
            font-size: 1rem;
            font-style: italic;
            background: rgba(251, 233, 210, 0.7);
            display: inline-block;
            padding: 6px 22px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 6px rgba(150, 100, 50, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 18px;
            margin: 30px 0 20px;
        }
        .grid img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 6px 12px rgba(90, 50, 20, 0.15);
            border: 3px solid #f5e5d5;
            background: #d9c2ae;
        }
        .grid img:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 20px rgba(120, 70, 30, 0.25);
            border-color: #d4a373;
        }

        .preview {
            margin-top: 25px;
            background: #fcf3e8;
            padding: 24px 20px 20px;
            border-radius: 36px 36px 20px 20px;
            box-shadow: inset 0 1px 8px #ffeac2, 0 8px 18px rgba(140, 80, 30, 0.15);
            text-align: center;
            border: 1px solid #ebd1b0;
        }
        .preview img {
            max-width: 100%;
            max-height: 520px;
            border-radius: 18px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            border: 4px solid #ffffffba;
            object-fit: contain;
        }

        .footer-note {
            text-align: right;
            font-size: 13px;
            color: #ad8a6f;
            margin-top: 8px;
        }

        /* 隐藏视频，只播放声音 */
        .hidden-video {
            display: none;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            h1 { font-size: 1.8rem; }
            .vinyl-record { width: 170px; height: 170px; }
            .record-label .label-title { font-size: 11px; }
        }
    </style>
</head>
<body>

    <!-- 信封封面 -->
    <div class="envelope" onclick="openAlbum()">
        <div class="letter">
            💌 亲爱的你<br>
            这份回忆 · 藏在抽屉里<br>
            轻触信封 展开时光 ✨
        </div>
        <div class="icon">💌</div>
    </div>

    <!-- 相册内容 -->
    <div class="gallery" id="albumGallery">
        <h1>📀 抽屉留声 · 记忆唱片</h1>

        <!-- 圆形黑胶唱片 -->
        <div class="record-player">
            <div class="vinyl-record" id="vinylDisc" onclick="toggleMusic()">
                <div class="record-label">
                    <span class="label-title">曾婉之</span>
                    <span class="label-sub">33⅓ RPM</span>
                </div>
                <div class="center-hole"></div>
            </div>
            <p>🎵 点击唱片 · 黑胶转动 · 音乐流淌</p>
        </div>
        
        <!-- 照片网格 -->
        <div class="grid">
            <img src="https://github.com/chenshuang998/chenshuang998.github.io/blob/main/zwz%E5%9B%BE%E7%89%87/2b952007df1981278a6c34e8f2d857f1.jpg?raw=true" onclick="showImg(this)" alt="温柔瞬间1" loading="lazy">
            <img src="https://github.com/chenshuang998/chenshuang998.github.io/blob/main/zwz%E5%9B%BE%E7%89%87/39b3de0022ec88d6a785d1baeb791984.jpg?raw=true" onclick="showImg(this)" alt="温柔瞬间2" loading="lazy">
            <img src="https://github.com/chenshuang998/chenshuang998.github.io/blob/main/zwz%E5%9B%BE%E7%89%87/421dad3d48774f855b425b9c42be82a0.jpg?raw=true" onclick="showImg(this)" alt="温柔瞬间3" loading="lazy">
            <img src="https://github.com/chenshuang998/chenshuang998.github.io/blob/main/zwz%E5%9B%BE%E7%89%87/4a74e25429d56ebe177df2f373db1959.jpg?raw=true" onclick="showImg(this)" alt="温柔瞬间4" loading="lazy">
            <img src="https://github.com/chenshuang998/chenshuang998.github.io/blob/main/zwz%E5%9B%BE%E7%89%87/699ffe8250a4d0acb73baf3dd0be490b.jpg?raw=true" onclick="showImg(this)" alt="温柔瞬间5" loading="lazy">
            <img src="https://github.com/chenshuang998/chenshuang998.github.io/blob/main/zwz%E5%9B%BE%E7%89%87/813f09bc5d6348fce2e1f0a5b901561d.jpg?raw=true" onclick="showImg(this)" alt="温柔瞬间6" loading="lazy">
            <img src="https://github.com/chenshuang998/chenshuang998.github.io/blob/main/zwz%E5%9B%BE%E7%89%87/b4240e1420f26fcb8ec8ea3d033057ae.jpg?raw=true" onclick="showImg(this)" alt="温柔瞬间7" loading="lazy">
        </div>

        <!-- 大图预览区 -->
        <div class="preview">
            <img id="bigImg" src="" alt="点击上方小图查看">
        </div>
        <div class="footer-note">—— 珍藏 · 我们的故事 ——</div>
    </div>

    <!-- ★★★ 隐藏的视频元素 —— 替换这里的 src 为你自己的视频地址 ★★★ -->
    <video id="bgVideo" class="hidden-video" loop preload="auto" playsinline>
        <!-- 请将下面的 VIDEO_URL 替换成你的视频链接 -->
        <source src="https://github.com/chenshuang998/chenshuang998.github.io/raw/refs/heads/main/zwz%E8%A7%86%E9%A2%91/%E6%B7%B1%E6%83%85%E5%91%8A%E7%99%BD%EF%BC%8C%E7%88%B1%E5%9C%A8%E5%BF%83%E5%A4%B4.m4a" type="video/mp4">
        您的浏览器不支持视频播放。
    </video>

    <script>
        (function(){
            "use strict";

            // ---------- 信封打开 ----------
            window.openAlbum = function() {
                const envelope = document.querySelector('.envelope');
                const gallery = document.querySelector('.gallery');
                envelope.classList.add('hide');
                gallery.classList.add('show');
                
                const firstImg = document.querySelector('.grid img');
                const bigImg = document.getElementById('bigImg');
                if (firstImg && bigImg) {
                    bigImg.src = firstImg.src;
                    bigImg.alt = firstImg.alt || '珍藏瞬间';
                }

                // 预加载视频（但不自动播放）
                const video = document.getElementById('bgVideo');
                if (video) {
                    video.load();
                }
            };

            // ---------- 预览大图 ----------
            window.showImg = function(imgElement) {
                const bigImg = document.getElementById('bigImg');
                if (imgElement && bigImg) {
                    bigImg.src = imgElement.src;
                    bigImg.alt = imgElement.alt || '放大记忆';
                }
            };

            // ---------- 黑胶唱片 · 视频声音控制 ----------
            const vinyl = document.getElementById('vinylDisc');
            const video = document.getElementById('bgVideo');
            let isPlaying = false;   // 同步状态

            // 确保视频元数据加载后音量合适
            if (video) {
                video.volume = 0.5;  // 50% 音量，可根据需要调整
                
                // 监听视频播放/暂停事件，同步旋转和状态
                video.addEventListener('play', function() {
                    isPlaying = true;
                    vinyl.classList.add('spin');
                });
                video.addEventListener('pause', function() {
                    isPlaying = false;
                    vinyl.classList.remove('spin');
                });
                video.addEventListener('ended', function() {
                    // loop 已启用，一般不会触发
                    isPlaying = false;
                    vinyl.classList.remove('spin');
                });
                // 处理加载错误
                video.addEventListener('error', function() {
                    console.warn('视频无法加载，请检查链接。');
                    vinyl.classList.remove('spin');
                    isPlaying = false;
                });
            }

            // 切换播放/暂停 (由唱片点击触发)
            window.toggleMusic = function() {
                if (!video) return;

                // 如果视频尚未加载元数据，先尝试加载
                if (video.readyState === 0) {
                    video.load();
                }

                if (video.paused) {
                    // 播放视频（画面隐藏，只听到声音）
                    video.play().then(() => {
                        vinyl.classList.add('spin');
                        isPlaying = true;
                    }).catch(err => {
                        console.warn('播放失败: ', err);
                        // 降级：让唱片转一下再停（视觉反馈）
                        vinyl.classList.add('spin');
                        isPlaying = true;
                        setTimeout(() => {
                            vinyl.classList.remove('spin');
                            isPlaying = false;
                        }, 2000);
                    });
                } else {
                    video.pause();
                    vinyl.classList.remove('spin');
                    isPlaying = false;
                }
            };

            // 页面卸载前暂停视频（释放资源）
            window.addEventListener('beforeunload', function() {
                if (video && !video.paused) {
                    video.pause();
                }
            });

            // 默认预览图设置（如果信封未打开时，bigImg没有src也没关系）
            // 这里不做额外处理，openAlbum 中已处理。
        })();
    </script>
    <!-- 
        使用说明：
        1. 找到上面 <video> 标签里的 src 属性。
        2. 将 "https://www.w3schools.com/html/mov_bbb.mp4" 替换成你自己的视频链接。
        3. 确保视频格式是浏览器支持的（如 MP4、WebM）。
        4. 视频链接需要支持跨域访问（通常上传到图床或对象存储即可）。
    -->
</body>
</html>
