<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎞️ 留声电影院 · 星空相册 · 云记忆</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== 全局 + 星空边缘效果 (保持不变) ===== */
        body {
            font-family: '微软雅黑', 'Segoe UI', sans-serif;
            background: #fff4e6;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        * { box-sizing: border-box; }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            background: radial-gradient(2px 2px at 15% 8%, #ffe8c7, transparent 80%),
                        radial-gradient(3px 3px at 85% 12%, #f0dbb0, transparent 80%),
                        radial-gradient(2px 2px at 22% 92%, #ffe3b5, transparent 80%),
                        radial-gradient(4px 4px at 78% 88%, #efd4a8, transparent 80%),
                        radial-gradient(3px 3px at 5% 45%, #ffebc2, transparent 80%),
                        radial-gradient(2px 2px at 95% 35%, #f8deae, transparent 80%),
                        radial-gradient(4px 4px at 40% 98%, #ffe5bc, transparent 80%),
                        radial-gradient(2px 2px at 65% 5%, #ffdbaa, transparent 80%),
                        radial-gradient(3px 3px at 92% 72%, #ffefc9, transparent 80%),
                        radial-gradient(2px 2px at 8% 75%, #fad9a3, transparent 80%),
                        radial-gradient(4px 4px at 48% 15%, #ffe0b7, transparent 80%),
                        radial-gradient(3px 3px at 55% 82%, #f2d19e, transparent 80%),
                        repeating-linear-gradient(45deg, rgba(25, 20, 15, 0.08) 0px, rgba(25, 20, 15, 0.08) 2px, 
                        transparent 2px, transparent 8px);
            background-color: #1f1a14;
            -webkit-mask: radial-gradient(circle at center, transparent 0, transparent calc(100% - 75px), black calc(100% - 75px));
            mask: radial-gradient(circle at center, transparent 0, transparent calc(100% - 75px), black calc(100% - 75px));
        }

        .envelope {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: #fbe9d2;
            background-image: radial-gradient(circle at 30% 40%, #fff3e0 0%, #fbe9d2 90%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; z-index: 999;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: inset 0 0 60px rgba(180, 100, 30, 0.1);
            border-bottom: 8px solid #e6c7a2;
        }
        .envelope.hide { opacity: 0; pointer-events: none; transform: translateY(-100%); }
        .envelope .letter {
            font-size: 48px; color: #5d3f2b; margin-bottom: 50px; text-align: center; line-height: 1.6;
            padding: 0 40px; font-weight: 400; letter-spacing: 6px;
            text-shadow: 4px 4px 0 rgba(255, 245, 220, 0.9);
        }
        .envelope .icon {
            font-size: 130px; color: #c25b3a;
            filter: drop-shadow(0 16px 20px rgba(160, 80, 40, 0.3));
            animation: beat 1.8s infinite;
        }
        @keyframes beat { 0%,100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.1); opacity: 1; } }

        .gallery {
            max-width: 1400px; width: 100%; margin: 0 auto;
            display: none; opacity: 0; transform: translateY(15px);
            transition: opacity 0.6s ease, transform 0.5s ease;
            position: relative; z-index: 2;
        }
        .gallery.show { display: block; opacity: 1; transform: translateY(0); }

        h1 {
            text-align: center; color: #4e3620; font-weight: 400; letter-spacing: 8px;
            margin: 10px 0 15px; font-size: 2.6rem; text-shadow: 3px 3px 0 #f0dbc0;
        }

        /* 加载状态 */
        .loading-indicator {
            text-align: center; padding: 30px; color: #5b3f2b; font-size: 1.2rem;
        }

        .record-players {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
            gap: 50px 80px; margin: 10px 0 20px;
        }
        .record-unit { display: flex; flex-direction: column; align-items: center; }
        .turntable { position: relative; width: 230px; height: 230px; margin-bottom: 8px; }

        .tonearm {
            position: absolute; top: 20px; right: 10px; width: 100px; height: 14px;
            background: linear-gradient(145deg, #c0c0c0, #7a7a7a);
            border-radius: 20px 4px 4px 20px;
            box-shadow: -2px 3px 6px rgba(0,0,0,0.3), inset 0 1px 3px #e0e0e0;
            transform-origin: 100% 50%; transform: rotate(25deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.3, 0.7, 1);
            z-index: 10; border-left: 3px solid #444; pointer-events: none;
        }
        .tonearm::before {
            content: ""; position: absolute; right: -6px; top: 2px; width: 20px; height: 10px;
            background: #b0b0b0; border-radius: 30% 10% 10% 30%; box-shadow: inset -1px 0 2px #555;
        }
        .tonearm::after {
            content: ""; position: absolute; left: 10px; top: -3px; width: 14px; height: 18px;
            background: #6a6a6a; border-radius: 4px 8px 2px 4px;
            box-shadow: inset 0 2px 3px #222, 0 2px 2px rgba(0,0,0,0.2);
        }
        .turntable.playing .tonearm { transform: rotate(5deg); }

        .vinyl-record {
            width: 210px; height: 210px; margin: 10px;
            background: radial-gradient(circle at 30% 28%, #3a3a3a, #0f0f0f 75%, #020202);
            border-radius: 50%;
            box-shadow: 0 14px 30px rgba(0,0,0,0.6), 0 0 0 2px #2b1a0e, inset 0 -5px 15px rgba(0,0,0,0.8);
            cursor: pointer; position: relative; transition: box-shadow 0.25s, transform 0.1s;
            border: 1px solid #4a3724;
        }
        .vinyl-record:hover {
            box-shadow: 0 18px 36px rgba(0,0,0,0.7), 0 0 0 3px #b87c4b; transform: scale(1.02);
        }
        .vinyl-record::before {
            content: ""; position: absolute; top: 6%; left: 6%; width: 88%; height: 88%;
            border-radius: 50%;
            background: repeating-radial-gradient(circle at 40% 40%, rgba(70,70,70,0.5) 0px, rgba(30,30,30,0.7) 3px, #1a1a1a 6px, #0a0a0a 9px);
            opacity: 0.7; mix-blend-mode: overlay; pointer-events: none;
        }
        .vinyl-record::after {
            content: ""; position: absolute; top: 10%; left: 15%; width: 35%; height: 20%;
            background: radial-gradient(circle, rgba(255,255,250,0.25) 0%, rgba(255,255,240,0) 80%);
            border-radius: 50%; transform: rotate(-15deg); pointer-events: none; filter: blur(3px);
        }
        .record-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 38%; height: 38%; background: linear-gradient(145deg, #d95c3a, #a83c1c);
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #f9e7d2; font-weight: bold;
            box-shadow: inset 0 -3px 6px #3b1a0e, inset 0 3px 8px #ffb08c, 0 2px 8px rgba(0,0,0,0.4);
            border: 2px solid #d6a177; pointer-events: none;
        }
        .record-label .label-title { font-size: 16px; margin-bottom: 2px; text-shadow: 1px 1px 0 #3e1a0c; }
        .record-label .label-sub { font-size: 10px; opacity: 0.9; border-top: 1px dashed #fad5b5; padding-top: 4px; }
        .center-hole {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; background: #1f140e; border-radius: 50%;
            box-shadow: inset 0 2px 3px #000; border: 1px solid #7a5a41; z-index: 5;
        }
        .vinyl-record.spin { animation: spin 3.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .record-unit p {
            margin-top: 8px; color: #5b3f2b; font-size: 1.1rem; font-style: italic;
            background: rgba(251, 233, 210, 0.85); padding: 6px 24px; border-radius: 40px;
            backdrop-filter: blur(2px); box-shadow: 0 2px 6px rgba(150,100,50,0.1);
        }

        .cinema-screen {
            max-width: 1000px; margin: 20px auto 30px; background: #1a130e; padding: 20px 20px 25px;
            border-radius: 30px 8px 30px 8px;
            box-shadow: 0 12px 22px rgba(0,0,0,0.4), inset 0 0 0 2px #c6a27a, inset 0 0 30px #000000aa;
            border-bottom: 8px solid #836b54;
        }
        .screen-title {
            color: #f3d9a4; margin: 0 0 12px 20px; font-size: 1.6rem; letter-spacing: 5px;
            text-shadow: 3px 3px 0 #3f2c1c;
        }
        #cinemaVideo {
            width: 100%; height: auto; border-radius: 16px; background: #000;
            box-shadow: inset 0 0 40px #000, 0 0 0 4px #6b4f39; display: block;
            object-fit: contain; aspect-ratio: 16/9;
        }

        .album-book { display: flex; flex-wrap: wrap; gap: 30px; margin: 20px 0 30px; }

        .book-left {
            flex: 1 1 350px; min-width: 280px; background: #f7e5d4; padding: 30px 25px 35px;
            border-radius: 30px 8px 30px 8px;
            box-shadow: inset 0 0 0 1px #fef3e9, 10px 14px 24px rgba(120, 70, 30, 0.2), 0 0 0 2px #dbbc9b;
            border-left: 8px solid #b58763;
        }
        .page-display { text-align: center; }
        .page-image {
            width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 16px;
            box-shadow: 0 8px 18px rgba(60, 30, 10, 0.3); border: 6px solid #f9efdf;
            background: #d4bba3; cursor: pointer;
        }
        .page-controls { display: flex; align-items: center; justify-content: center; margin-top: 25px; gap: 25px; }
        .page-btn {
            background: #dbb594; border: none; color: #3d2a1b; font-size: 2.2rem; font-weight: bold;
            width: 60px; height: 60px; border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            box-shadow: 0 5px 0 #7a5d47, 0 8px 12px rgba(0,0,0,0.15); cursor: pointer;
            transition: all 0.1s; border: 1px solid #edcbb2; display: flex;
            align-items: center; justify-content: center;
        }
        .page-btn:hover { background: #e7c2a4; transform: translateY(-3px); box-shadow: 0 8px 0 #7a5d47, 0 10px 16px rgba(0,0,0,0.15); }
        .page-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7a5d47, 0 6px 10px rgba(0,0,0,0.1); }
        .page-btn:disabled { opacity: 0.4; transform: none; box-shadow: 0 5px 0 #7a5d47; pointer-events: none; background: #c2aa96; }
        .page-indicator {
            font-size: 1.5rem; color: #4b311e; background: #f4e5d7; padding: 10px 24px;
            border-radius: 40px; box-shadow: inset 0 1px 6px #ccb7a3; font-weight: 600; letter-spacing: 3px;
        }

        .preview-area {
            flex: 1 1 400px; min-width: 300px; background: #fcf3e8; padding: 25px 20px;
            border-radius: 30px 8px 30px 8px;
            box-shadow: inset 0 1px 10px #ffeac2, 0 10px 20px rgba(140, 80, 30, 0.15);
            border: 1px solid #ebd1b0; display: flex; flex-direction: column; justify-content: center;
        }
        .preview-title {
            font-size: 1.3rem; color: #7b5c42; margin-bottom: 15px; font-style: italic; text-align: center;
        }
        .preview-area img {
            max-width: 100%; max-height: 350px; border-radius: 20px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15); border: 5px solid #ffffffd9;
            object-fit: contain; margin: 0 auto;
        }

        .footer-note { text-align: right; font-size: 15px; color: #ad8a6f; margin-top: 20px; padding-right: 10px; }

        @media (max-width: 900px) {
            .album-book { flex-direction: column; }
            .record-players { gap: 30px; }
            h1 { font-size: 2rem; }
            .turntable { width: 200px; height: 200px; }
            .vinyl-record { width: 180px; height: 180px; }
            .envelope .letter { font-size: 36px; }
            .envelope .icon { font-size: 100px; }
            .cinema-screen { padding: 12px; }
            .screen-title { font-size: 1.3rem; }
        }

        @media (max-width: 600px) {
            body::before {
                -webkit-mask: radial-gradient(circle at center, transparent 0, transparent calc(100% - 40px), black calc(100% - 40px));
                mask: radial-gradient(circle at center, transparent 0, transparent calc(100% - 40px), black calc(100% - 40px));
            }
        }
    </style>
</head>
<body>

    <!-- 超大信封 -->
    <div class="envelope" onclick="openAlbum()">
        <div class="letter">
            💌 亲爱的你<br>
            这份回忆 · 藏在抽屉里<br>
            轻触信封 展开时光 ✨
        </div>
        <div class="icon">💌</div>
    </div>

    <!-- 相册主体 -->
    <div class="gallery" id="albumGallery">
        <h1>🎬 时光放映机 · 星空留声</h1>

        <!-- 双唱片区域 -->
        <div class="record-players">
            <div class="record-unit">
                <div class="turntable" id="turntable1">
                    <div class="tonearm" id="tonearm1"></div>
                    <div class="vinyl-record" id="vinylDisc1" onclick="toggleBgMusic()">
                        <div class="record-label">
                            <span class="label-title">曾婉之</span>
                            <span class="label-sub">33⅓ RPM</span>
                        </div>
                        <div class="center-hole"></div>
                    </div>
                </div>
                <p>🎵 点击播放 · 背景旋律</p>
            </div>
            <div class="record-unit">
                <div class="turntable" id="turntable2">
                    <div class="tonearm" id="tonearm2"></div>
                    <div class="vinyl-record" id="vinylDisc2" onclick="toggleVideoPlay()">
                        <div class="record-label">
                            <span class="label-title">电影记忆</span>
                            <span class="label-sub">45 RPM</span>
                        </div>
                        <div class="center-hole"></div>
                    </div>
                </div>
                <p>🎞️ 点击放映 · 珍贵影像</p>
            </div>
        </div>

        <!-- 独立电影屏幕 -->
        <div class="cinema-screen">
            <div class="screen-title">🎥 独家放映厅</div>
            <video id="cinemaVideo" loop playsinline preload="metadata">
                <!-- 视频源将通过数据库动态设置 -->
            </video>
        </div>
        
        <!-- 下方：翻页相册 + 大图预览 -->
        <div class="album-book">
            <div class="book-left">
                <div class="page-display">
                    <img id="bookPageImg" class="page-image" src="" alt="书页照片" onclick="nextPage()" title="点击翻到下一页">
                </div>
                <div class="page-controls">
                    <button class="page-btn" id="prevBtn" onclick="prevPage()" title="上一页">←</button>
                    <span class="page-indicator" id="pageIndicator">- / -</span>
                    <button class="page-btn" id="nextBtn" onclick="nextPage()" title="下一页">→</button>
                </div>
                <p style="text-align:center; margin-top:15px; color:#6f4e34;">✨ 点击照片也可翻页</p>
            </div>

            <div class="preview-area">
                <div class="preview-title">🔍 放大 · 珍藏细节</div>
                <img id="bigImg" src="" alt="点击翻页查看大图">
            </div>
        </div>
        <div class="footer-note">—— 故事在唱片里，影像在银幕上 ——</div>
    </div>

    <!-- 隐藏的背景音频 -->
    <audio id="bgAudio" loop preload="auto"></audio>

    <script>
        (function(){
            "use strict";

            // ---------- Supabase 配置 ----------
            const SUPABASE_URL = 'https://cupvezbkwsllyekmwjxd.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_BqyzVhkal7cGThx1kwYpXg_ECeaRf0C';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // ---------- 全局变量 ----------
            let photoList = [];                // 存储所有照片URL
            let totalPages = 0;
            let currentIndex = 0;
            let audioUrl = '';                // 背景音乐URL (取第一条有audio_url的记录)
            let videoUrl = '';                // 电影视频URL (取第一条有video_url的记录)

            // DOM 元素
            const bookPageImg = document.getElementById('bookPageImg');
            const bigImg = document.getElementById('bigImg');
            const pageIndicator = document.getElementById('pageIndicator');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const audio = document.getElementById('bgAudio');
            const video = document.getElementById('cinemaVideo');
            const gallery = document.querySelector('.gallery');

            // 唱片和唱臂
            const turntable1 = document.getElementById('turntable1');
            const vinyl1 = document.getElementById('vinylDisc1');
            const turntable2 = document.getElementById('turntable2');
            const vinyl2 = document.getElementById('vinylDisc2');

            // ---------- 从 Supabase 加载数据 ----------
            async function loadDataFromSupabase() {
                try {
                    // 查询所有记录，按创建时间排序（或者你可以自定义排序）
                    const { data, error } = await supabase
                        .from('chenshuang')
                        .select('*')
                        .order('created_at', { ascending: true });
                    
                    if (error) throw error;
                    if (!data || data.length === 0) {
                        console.warn('数据库中没有数据，请先添加记录。');
                        return;
                    }

                    // 提取照片列表（过滤出有 image_url 的记录）
                    photoList = data
                        .filter(item => item.image_url)
                        .map(item => item.image_url);
                    totalPages = photoList.length;

                    // 提取音频URL（取第一条有 audio_url 的记录）
                    const audioRecord = data.find(item => item.audio_url);
                    if (audioRecord) {
                        audioUrl = audioRecord.audio_url;
                        // 设置音频源
                        audio.innerHTML = `<source src="${audioUrl}" type="audio/mp4">`;
                        audio.load();
                    }

                    // 提取视频URL（取第一条有 video_url 的记录）
                    const videoRecord = data.find(item => item.video_url);
                    if (videoRecord) {
                        videoUrl = videoRecord.video_url;
                        // 设置视频源
                        video.innerHTML = `<source src="${videoUrl}" type="video/mp4">`;
                        video.load();
                    }

                    // 如果照片列表不为空，初始化显示
                    if (totalPages > 0) {
                        updatePage(0);
                    } else {
                        // 没有照片时显示占位
                        pageIndicator.textContent = '0 / 0';
                    }

                } catch (err) {
                    console.error('加载数据失败:', err);
                    alert('加载相册数据失败，请检查网络或数据库配置。');
                }
            }

            // 更新页面显示
            function updatePage(index) {
                if (totalPages === 0) return;
                if (index < 0) index = 0;
                if (index >= totalPages) index = totalPages - 1;
                currentIndex = index;
                const src = photoList[currentIndex];
                bookPageImg.src = src;
                bigImg.src = src;
                pageIndicator.textContent = `${currentIndex+1} / ${totalPages}`;
                prevBtn.disabled = (currentIndex === 0);
                nextBtn.disabled = (currentIndex === totalPages - 1);
            }

            // 翻页方法
            window.nextPage = () => { if (currentIndex < totalPages-1) updatePage(currentIndex+1); };
            window.prevPage = () => { if (currentIndex > 0) updatePage(currentIndex-1); };

            // 打开信封 (先加载数据，再显示)
            window.openAlbum = async () => {
                const envelope = document.querySelector('.envelope');
                envelope.classList.add('hide');
                gallery.classList.add('show');
                
                // 显示加载状态（可选）
                if (photoList.length === 0) {
                    // 如果还没加载过数据，现在加载
                    await loadDataFromSupabase();
                }
                
                // 如果数据加载后仍无照片，可以显示提示
                if (totalPages === 0) {
                    pageIndicator.textContent = '暂无照片';
                }
            };

            // ---------- 音乐控制 ----------
            audio.volume = 0.4;
            audio.addEventListener('play', () => { vinyl1.classList.add('spin'); turntable1.classList.add('playing'); });
            audio.addEventListener('pause', () => { vinyl1.classList.remove('spin'); turntable1.classList.remove('playing'); });
            window.toggleBgMusic = () => {
                if (!audioUrl) {
                    alert('还没有设置背景音乐，请在数据库中添加 audio_url 字段。');
                    return;
                }
                audio.paused ? audio.play() : audio.pause();
            };

            // ---------- 视频控制 ----------
            video.volume = 0.7;
            video.addEventListener('play', () => { vinyl2.classList.add('spin'); turntable2.classList.add('playing'); });
            video.addEventListener('pause', () => { vinyl2.classList.remove('spin'); turntable2.classList.remove('playing'); });
            window.toggleVideoPlay = () => {
                if (!videoUrl) {
                    alert('还没有设置电影视频，请在数据库中添加 video_url 字段。');
                    return;
                }
                video.paused ? video.play() : video.pause();
            };

            // 键盘翻页
            window.addEventListener('keydown', (e) => {
                if (!gallery.classList.contains('show')) return;
                if (e.key === 'ArrowLeft') { e.preventDefault(); prevPage(); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); nextPage(); }
            });

            // 页面卸载时暂停
            window.addEventListener('beforeunload', () => {
                if (!audio.paused) audio.pause();
                if (!video.paused) video.pause();
            });

            // 预加载数据（可选，提前拉取，让打开更快）
            loadDataFromSupabase();

        })();
    </script>
</body>
</html>
